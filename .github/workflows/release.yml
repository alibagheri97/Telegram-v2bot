name: Release bundle
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock && python -m pip install -e '.[dev]'
      - run: ruff check . && pytest -q
      - run: python -m vpnshopbot.release bundle --output "dist/vpn-shop-${GITHUB_REF_NAME}.tar.gz"
      - name: Publish private repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
