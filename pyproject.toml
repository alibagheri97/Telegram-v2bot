[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-shop-telegram-bot"
version = "1.0.1"
description = "Persian Telegram VPN shop for a V2Board-compatible database"
requires-python = ">=3.11"
dependencies = [
  "APScheduler>=3.10,<4",
  "bcrypt>=4.1,<5",
  "Flask>=3.1,<4",
  "gunicorn>=23,<24",
  "PyMySQL>=1.1,<2",
  "pydantic-settings>=2.6,<3",
  "pyTelegramBotAPI>=4.24,<5",
  "qrcode[pil]>=8,<9",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]

[project.scripts]
vpn-shop-bot = "vpnshopbot.app:main"

[tool.setuptools.packages.find]
include = ["vpnshopbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
